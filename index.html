<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeX Ultimate</title><style>*{box-sizing:border-box;font-family:-apple-system,Arial}body{margin:0;background:#000;color:#fff}.header{background:#FF8C00;padding:16px;text-align:center;font-weight:bold;font-size:20px;position:sticky;top:0;z-index:10}.container{padding:14px;max-width:480px;margin:0 auto}.card{background:#121212;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #222}.input-wrap{position:relative;margin-bottom:12px}.input-wrap input{width:100%;padding:14px 44px 14px 14px;border-radius:10px;border:none;background:#E5E5E5;color:#000;font-size:16px}.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:20px;cursor:pointer}.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#FF8C00;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.btn-outline{background:#222}.links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}.links a{color:#FF8C00;cursor:pointer}.balance{font-size:32px;font-weight:bold;color:#00FF88}.trade-btns{display:flex;gap:10px;margin-top:14px}.trade-btns button{flex:1;padding:14px;border-radius:10px;border:none;font-weight:bold}.buy{background:#00C853;color:#fff}.sell{background:#D50000;color:#fff}#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:20px;border-radius:14px;min-width:300px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}#toast.show{display:block}#app{display:none}#auth{display:block}</style></head><body><div class="header">🔥 TradeX Ultimate</div>

<div id="auth" class="container"><div class="card"><h2>Signup</h2><div class="input-wrap"><input id="sEmail" type="email" placeholder="Email"></div><div class="input-wrap"><input id="sPass" type="password" placeholder="Password"><button class="eye" onclick="toggle('sPass',this)">👁️</button></div><button class="btn" onclick="signup()">Signup</button></div><div class="card"><h2>Login</h2><div class="input-wrap"><input id="lEmail" type="email" placeholder="Email"></div><div class="input-wrap"><input id="lPass" type="password" placeholder="Password"><button class="eye" onclick="toggle('lPass',this)">👁️</button></div><button class="btn" onclick="login()">Login</button><div class="links"><a onclick="forgot()">Forgot password?</a><a onclick="showUsers()">Show saved email</a></div></div></div>

<div id="app" class="container"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="color:#888;font-size:13px">Total Balance</div><div class="balance" id="bal">$10,000.00</div><div id="userEmail" style="color:#888;font-size:12px;margin-top:4px"></div></div><button onclick="logout()" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:8px">Logout</button></div></div><div class="card"><h3 style="margin:0 0 10px">BTC/USDT</h3><div style="height:120px;background:#0a0a0a;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#00FF88;font-size:22px;font-weight:bold" id="price">$67,432.21 ↗ 2.4%</div><div class="trade-btns"><button class="buy" onclick="trade('BUY')">BUY / LONG</button><button class="sell" onclick="trade('SELL')">SELL / SHORT</button></div></div><div class="card"><h3>Open Trades</h3><div id="trades" style="color:#888;font-size:14px">No open trades. Tap BUY or SELL to start trading!</div></div></div>

<div id="toast"><span style="color:#007AFF;float:right;font-weight:bold;cursor:pointer" onclick="hide()">Close</span><div id="tHead" style="font-weight:bold;margin-bottom:8px"></div><div id="tBody" style="font-size:14px;color:#333"></div><button id="toastAction" class="btn" style="margin-top:12px;display:none" onclick="goToDashboard()">Go to Dashboard →</button></div>

<script>
let users=JSON.parse(localStorage.getItem('tradex_users')||'[]');
let currentUser=null;
let balance=10000;
function save(){localStorage.setItem('tradex_users',JSON.stringify(users))}
function toggle(id,b){const i=document.getElementById(id);if(i.type==='password'){i.type='text';b.textContent='🙈'}else{i.type='password';b.textContent='👁️'}}
function showMsg(h,b,showBtn){document.getElementById('tHead').innerHTML=h;document.getElementById('tBody').innerHTML=b;document.getElementById('toastAction').style.display=showBtn?'block':'none';document.getElementById('toast').classList.add('show')}
function hide(){document.getElementById('toast').classList.remove('show')}
function goToDashboard(){hide();document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userEmail').innerText=currentUser;document.getElementById('bal').innerText='$'+balance.toFixed(2)}
function signup(){const e=document.getElementById('sEmail').value.trim().toLowerCase();const p=document.getElementById('sPass').value.trim();if(!e||!p){showMsg('Error','Fill email and password');return}if(users.find(u=>u.email===e)){showMsg('Exists','Already signed up - Please login');return}users.push({email:e,pass:p});save();showMsg('Success ✅','Signup done! Now login with same email','');document.getElementById('sEmail').value='';document.getElementById('sPass').value=''}
function login(){const e=document.getElementById('lEmail').value.trim().toLowerCase();const p=document.getElementById('lPass').value.trim();const f=users.find(u=>u.email===e&&u.pass===p);if(f){currentUser=e;showMsg('Welcome ✅','Login success!','',true);document.getElementById('toastAction').style.display='block'}else{const ex=users.find(u=>u.email===e);if(ex)showMsg('Wrong login ❌','Password wrong<br>Click Forgot password?');else showMsg('Wrong login ❌','No account for '+e+'<br>Signup first')}} 
function forgot(){const email=prompt('Enter your email:');if(!email)return;const c=email.trim().toLowerCase();const idx=users.findIndex(u=>u.email===c);if(idx===-1){showMsg('Not found','No account for '+c);return}const np=prompt('Enter NEW password:');if(!np)return;users[idx].pass=np.trim();save();showMsg('Reset done ✅','New password saved: <b>'+np.trim()+'</b><br>Now login')}
function showUsers(){if(users.length===0){showMsg('No users','No signup yet');return}showMsg('Saved emails',users.map(u=>u.email).join('<br>'))}
function logout(){document.getElementById('app').style.display='none';document.getElementById('auth').style.display='block';currentUser=null;hide()}
function trade(type){const amt=100;const price=document.getElementById('price').innerText;const div=document.getElementById('trades');const id=Date.now();const html='<div style="background:#1a1a1a;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between"><span>'+type+' BTC $'+amt+'</span><span style="color:#00FF88">+ $2.40</span></div>';div.innerHTML=html+div.innerHTML;balance+=2.4;document.getElementById('bal').innerText='$'+balance.toFixed(2);showMsg(type+' Executed ✅',type+' $'+amt+' at '+price)}
setInterval(()=>{const base=67432;const r=(Math.random()-0.5)*200;document.getElementById('price').innerText='$'+(base+r).toFixed(2)+' ↗ '+(Math.random()*3).toFixed(1)+'%';},3000)
</script></body></html>
