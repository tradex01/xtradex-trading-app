<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeX Ultimate</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#000;color:#fff}
.header{background:#FF8C00;padding:16px;text-align:center;font-weight:bold;font-size:20px}
.container{padding:14px;max-width:480px;margin:0 auto}
.card{background:#121212;border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid #222}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input{width:100%;padding:14px 44px 14px 14px;border-radius:10px;border:none;background:#E5E5E5;color:#000;font-size:16px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:20px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#FF8C00;color:#fff;font-weight:bold;font-size:16px}
.links{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.links a{color:#FF8C00;text-decoration:none}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:20px;border-radius:14px;min-width:280px;display:none;z-index:99}
#toast.show{display:block}
.close{color:#007AFF;float:right;font-weight:bold}
</style>
</head>
<body>
<div class="header">🔥 TradeX Ultimate</div>
<div class="container">
<div class="card">
<h2>Signup</h2>
<div class="input-wrap"><input id="sEmail" type="email" placeholder="Email"></div>
<div class="input-wrap"><input id="sPass" type="password" placeholder="Password"><button class="eye" onclick="toggle('sPass',this)">👁️</button></div>
<button class="btn" onclick="signup()">Signup</button>
</div>
<div class="card">
<h2>Login</h2>
<div class="input-wrap"><input id="lEmail" type="email" placeholder="Email"></div>
<div class="input-wrap"><input id="lPass" type="password" placeholder="Password"><button class="eye" onclick="toggle('lPass',this)">👁️</button></div>
<button class="btn" onclick="login()">Login</button>
<div class="links"><a onclick="forgot()">Forgot password?</a><a onclick="showUsers()">Show saved email</a></div>
</div>
</div>
<div id="toast"><span class="close" onclick="hide()">Close</span><div id="tHead" style="font-weight:bold;margin-bottom:8px"></div><div id="tBody" style="font-size:14px;color:#333"></div></div>
<script>
let users=JSON.parse(localStorage.getItem('tradex_users')||'[]');
function save(){localStorage.setItem('tradex_users',JSON.stringify(users));}
function toggle(id,b){const i=document.getElementById(id);if(i.type==='password'){i.type='text';b.textContent='🙈';}else{i.type='password';b.textContent='👁️';}}
function showMsg(h,b){document.getElementById('tHead').innerHTML=h;document.getElementById('tBody').innerHTML=b;document.getElementById('toast').classList.add('show');}
function hide(){document.getElementById('toast').classList.remove('show');}
function signup(){const e=document.getElementById('sEmail').value.trim().toLowerCase();const p=document.getElementById('sPass').value.trim();if(!e||!p){showMsg('Error ❌','Fill email and password');return;}if(users.find(u=>u.email===e)){showMsg('Exists ⚠️','Already signed up, go login');return;}users.push({email:e,pass:p});save();showMsg('Success ✅','Signup done! Now login');document.getElementById('sEmail').value='';document.getElementById('sPass').value='';}
function login(){const e=document.getElementById('lEmail').value.trim().toLowerCase();const p=document.getElementById('lPass').value.trim();const f=users.find(u=>u.email===e&&u.pass===p);if(f){showMsg('Welcome ✅','Login success!');}else{const ex=users.find(u=>u.email===e);if(ex)showMsg('Wrong login ❌','Password wrong<br>Click Forgot password?');else showMsg('Wrong login ❌','No account for '+e+'<br>Signup first');}}
function forgot(){const email=prompt('Enter your email:');if(!email)return;const c=email.trim().toLowerCase();const idx=users.findIndex(u=>u.email===c);if(idx===-1){showMsg('Not found ❌','No account with '+c);return;}const np=prompt('Enter NEW password for '+c+':');if(!np)return;users[idx].pass=np.trim();save();showMsg('Reset done ✅','New password: <b>'+np.trim()+'</b><br>Now login');}
function showUsers(){if(users.length===0){showMsg('No users','No signup on this phone');return;}showMsg('Saved emails',users.map(u=>u.email).join('<br>'));}
</script>
</body>
</html>
